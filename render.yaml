services:
  - type: web
    name: veyra-api
    env: python
    plan: free
    buildCommand: chmod +x render-build.sh && ./render-build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HF_HOME
        value: /tmp/hf-cache
      - key: TRANSFORMERS_CACHE
        value: /tmp/hf-cache
      - key: VEYRA_CORS_ORIGINS
        value: https://veyra-1.vercel.app
      - key: DATABASE_URL
        sync: false
    healthCheckPath: /
    autoDeploy: true
    # Keep-alive configuration for free tier
    # Use uptime monitoring services like UptimeRobot, Pingdom, or Better Uptime
    # to ping the /health endpoint every 5-10 minutes to prevent cold starts
    # Example: https://your-render-url.onrender.com/health
    # Also consider using https://uptimerobot.com/ for free monitoring
    # Alternatively, call the /warmup endpoint after deployment:
    # curl https://your-render-url.onrender.com/warmup
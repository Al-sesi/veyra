services:
  - type: web
    name: veyra-api
    env: python
    plan: free
    buildCommand: chmod +x render-build.sh && ./render-build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HF_HOME
        value: /tmp/hf-cache
      - key: TRANSFORMERS_CACHE
        value: /tmp/hf-cache
      - key: VEYRA_CORS_ORIGINS
        value: https://veyra-seven-beryl.vercel.app
      - key: DATABASE_URL
        sync: false
    healthCheckPath: /
    autoDeploy: true